<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- 左侧普通章鱼 -->
  <!-- 头部 -->
  <circle cx="200" cy="200" r="150" fill="white" stroke="black" stroke-width="4"/>
  <!-- 眼睛 -->
  <circle cx="170" cy="180" r="30" fill="black"/>
  <circle cx="180" cy="170" r="10" fill="white"/>
  <!-- 腮红 -->
  <circle cx="130" cy="220" r="20" fill="#FFE0E0"/>
  <!-- 嘴巴 -->
  <path d="M180 250 Q200 270 220 250" fill="none" stroke="black" stroke-width="4"/>
  <!-- 左侧触手 -->
  <path d="M120 250 C80 300 60 350 80 390" fill="none" stroke="black" stroke-width="4"/>
  <path d="M100 260 C60 310 40 360 60 400" fill="none" stroke="black" stroke-width="4"/>
  <!-- 中间触手 -->
  <path d="M200 350 C200 380 190 400 200 400" fill="none" stroke="black" stroke-width="4"/>
  <!-- 右侧触手（左侧部分） -->
  <path d="M280 250 C320 300 340 350 320 390" fill="none" stroke="black" stroke-width="4"/>
  <path d="M300 260 C340 310 360 360 340 400" fill="none" stroke="black" stroke-width="4"/>
  <!-- 触手吸盘 -->
  <circle cx="100" cy="360" r="6" fill="black"/>
  <circle cx="110" cy="380" r="6" fill="black"/>
  <circle cx="80" cy="340" r="6" fill="black"/>
  <circle cx="90" cy="360" r="6" fill="black"/>
  <circle cx="180" cy="380" r="6" fill="black"/>
  <circle cx="190" cy="390" r="6" fill="black"/>
  <circle cx="210" cy="390" r="6" fill="black"/>
  <circle cx="220" cy="380" r="6" fill="black"/>
  
  <!-- 中线 -->
  <line x1="200" y1="50" x2="200" y2="400" stroke="black" stroke-width="4"/>
  
  <!-- 右侧机器人章鱼 -->
  <!-- 头部 -->
  <rect x="200" y="50" width="150" height="300" fill="#E0E0E0" stroke="black" stroke-width="4"/>
  <!-- 头部细节 -->
  <rect x="220" y="70" width="110" height="30" fill="#C0C0C0" stroke="black" stroke-width="2"/>
  <circle cx="240" cy="85" r="3" fill="black"/>
  <circle cx="260" cy="85" r="3" fill="black"/>
  <!-- 眼睛 -->
  <rect x="220" y="120" width="110" height="100" fill="black" stroke="black" stroke-width="4"/>
  <circle cx="270" cy="170" r="30" fill="#C0C0C0"/>
  <circle cx="280" cy="160" r="10" fill="white"/>
  <text x="240" y="150" font-family="Arial" font-size="20" fill="white">AI</text>
  <!-- 头部右侧细节 -->
  <rect x="320" y="100" width="30" height="140" fill="#C0C0C0" stroke="black" stroke-width="4"/>
  <circle cx="335" cy="170" r="10" fill="#808080"/>
  <!-- 下巴部分 -->
  <rect x="220" y="240" width="110" height="60" fill="#C0C0C0" stroke="black" stroke-width="4"/>
  <circle cx="240" cy="270" r="3" fill="black"/>
  <circle cx="260" cy="270" r="3" fill="black"/>
  <circle cx="280" cy="270" r="3" fill="black"/>
  <circle cx="300" cy="270" r="3" fill="black"/>
  <!-- 右侧触手（右侧部分） -->
  <path d="M280 250 C320 300 340 350 320 390" fill="none" stroke="black" stroke-width="4" stroke-dasharray="5,5"/>
  <path d="M300 260 C340 310 360 360 340 400" fill="none" stroke="black" stroke-width="4" stroke-dasharray="5,5"/>
  <!-- 机器人触手 -->
  <path d="M280 250 C320 300 340 350 320 390" fill="#E0E0E0" stroke="black" stroke-width="4"/>
  <path d="M300 260 C340 310 360 360 340 400" fill="#E0E0E0" stroke="black" stroke-width="4"/>
  <!-- 机器人触手细节 -->
  <rect x="310" cy="350" width="20" height="10" fill="#C0C0C0" stroke="black" stroke-width="2"/>
  <rect x="330" cy="370" width="20" height="10" fill="#C0C0C0" stroke="black" stroke-width="2"/>
  <!-- 机器人触手吸盘 -->
  <circle cx="300" cy="360" r="6" fill="#808080"/>
  <circle cx="310" cy="380" r="6" fill="#808080"/>
  <circle cx="320" cy="340" r="6" fill="#808080"/>
  <circle cx="330" cy="360" r="6" fill="#808080"/>
</svg>
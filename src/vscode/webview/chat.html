<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kraken Chat</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: var(--vscode-font-family);
      color: var(--vscode-foreground);
      background-color: var(--vscode-editor-background);
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .message {
      margin-bottom: 12px;
      padding: 8px 12px;
      border-radius: 4px;
    }

    .message.user {
      background-color: var(--vscode-input-background);
      border-left: 3px solid var(--vscode-button-background);
    }

    .message.assistant {
      background-color: var(--vscode-editor-inactiveSelectionBackground);
      border-left: 3px solid var(--vscode-charts-green);
    }

    .message.thinking {
      background-color: var(--vscode-textBlockQuote-background);
      border-left: 3px solid var(--vscode-charts-blue);
      font-style: italic;
      opacity: 0.8;
    }

    .message.tool {
      background-color: var(--vscode-textPreformat-background);
      border-left: 3px solid var(--vscode-charts-yellow);
      font-family: var(--vscode-editor-font-family);
      font-size: 0.9em;
    }

    .message.error {
      background-color: var(--vscode-inputValidation-errorBackground);
      border-left: 3px solid var(--vscode-inputValidation-errorBorder);
    }

    .message-header {
      font-weight: bold;
      margin-bottom: 4px;
      font-size: 0.85em;
      opacity: 0.8;
    }

    .message-content {
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message-content code {
      background-color: var(--vscode-textCodeBlock-background);
      padding: 2px 4px;
      border-radius: 3px;
      font-family: var(--vscode-editor-font-family);
    }

    .message-content pre {
      background-color: var(--vscode-textCodeBlock-background);
      padding: 8px;
      border-radius: 4px;
      overflow-x: auto;
    }

    .input-container {
      padding: 12px;
      border-top: 1px solid var(--vscode-panel-border);
      background-color: var(--vscode-sideBar-background);
    }

    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--vscode-input-border);
      background-color: var(--vscode-input-background);
      color: var(--vscode-input-foreground);
      border-radius: 4px;
      resize: vertical;
      font-family: var(--vscode-font-family);
      font-size: inherit;
    }

    textarea:focus {
      outline: 1px solid var(--vscode-focusBorder);
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    button {
      flex: 1;
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      background-color: var(--vscode-button-background);
      color: var(--vscode-button-foreground);
      cursor: pointer;
      font-family: var(--vscode-font-family);
    }

    button:hover {
      background-color: var(--vscode-button-hoverBackground);
    }

    button#clear {
      background-color: var(--vscode-button-secondaryBackground);
      color: var(--vscode-button-secondaryForeground);
    }

    button#clear:hover {
      background-color: var(--vscode-button-secondaryHoverBackground);
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div id="messages" class="messages"></div>
    <div class="input-container">
      <textarea id="input" rows="3" placeholder="Ask Kraken..."></textarea>
      <div class="button-group">
        <button id="send">Send</button>
        <button id="clear">Clear Session</button>
      </div>
    </div>
  </div>

  <script>
    const vscode = acquireVsCodeApi();
    const messagesDiv = document.getElementById('messages');
    const inputTextarea = document.getElementById('input');
    const sendButton = document.getElementById('send');
    const clearButton = document.getElementById('clear');

    // Handle incoming messages from extension
    window.addEventListener('message', event => {
      const message = event.data;

      switch (message.type) {
        case 'userMessage':
          addMessage('user', 'You', message.content);
          break;
        case 'thinking':
          addMessage('thinking', 'Thinking', message.content);
          break;
        case 'toolCall':
          addMessage('tool', 'Tool Call', `${message.toolName}\n${JSON.stringify(message.input, null, 2)}`);
          break;
        case 'toolResult':
          const status = message.ok ? '✓' : '✗';
          addMessage('tool', `Tool Result ${status}`, message.result);
          break;
        case 'response':
          addMessage('assistant', 'Kraken', message.content);
          break;
        case 'error':
          addMessage('error', 'Error', message.error);
          break;
        case 'sessionCleared':
          messagesDiv.innerHTML = '';
          addMessage('thinking', 'System', 'Session cleared');
          break;
      }
    });

    // Add message to chat
    function addMessage(type, header, content) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${type}`;

      const headerDiv = document.createElement('div');
      headerDiv.className = 'message-header';
      headerDiv.textContent = header;

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      contentDiv.textContent = content;

      messageDiv.appendChild(headerDiv);
      messageDiv.appendChild(contentDiv);
      messagesDiv.appendChild(messageDiv);

      // Scroll to bottom
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // Send message
    function sendMessage() {
      const message = inputTextarea.value.trim();
      if (message) {
        vscode.postMessage({ type: 'userMessage', message });
        inputTextarea.value = '';
      }
    }

    // Event listeners
    sendButton.addEventListener('click', sendMessage);
    clearButton.addEventListener('click', () => {
      vscode.postMessage({ type: 'clearSession' });
    });

    inputTextarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Focus input on load
    inputTextarea.focus();
  </script>
</body>
</html>
